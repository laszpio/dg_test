name: Elixir CI

on: [push, pull_request]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Solr
        run: docker compose up -d

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions', '**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Restore PLT cache
        uses: actions/cache@v6
        with:
          path: _build/dev/*.plt*
          key: ${{ runner.os }}-plt-${{ hashFiles('.tool-versions', '**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ hashFiles('.tool-versions') }}-

      - name: Check Formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Run tests
        env:
          SOLR_URL: "http://localhost:8983/solr"
          SOLR_CMD: "docker exec dg_test-solr-1 solr"
          SOLR_TIMEOUT: "15000"
        run: mix test
